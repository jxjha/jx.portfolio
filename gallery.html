<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Gallery — Janmesh Jha</title>
<meta name="description" content="A room in space. Float through 21 photographs on a 3D winding path.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d0908">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Janmesh Jha">
<meta property="og:title" content="The Gallery — Janmesh Jha">
<meta property="og:description" content="A room in space. Float through it.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bone:#F1E8D8;--sienna:#C25A2E;--muted:#9a8b78;--ink:#0d0908}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0d0908;color:var(--bone);font-family:'Space Mono',monospace;overflow-x:hidden;cursor:none}
::selection{background:var(--sienna);color:var(--bone)}
a{color:inherit;text-decoration:none}
#scene{position:fixed;inset:0;z-index:1}
.scroller{position:relative;z-index:2;height:1050vh;pointer-events:none}

/* cursor */
.cursor{position:fixed;top:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--sienna);pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
.cursor-ring{position:fixed;top:0;left:0;width:38px;height:38px;border:1px solid rgba(241,232,216,.6);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .25s,height .25s}
.hovering .cursor{width:0;height:0}.hovering .cursor-ring{width:58px;height:58px}
@media (hover:none){body{cursor:auto}.cursor,.cursor-ring{display:none}}

/* overlay UI */
.ui{position:fixed;inset:0;z-index:5;pointer-events:none}
.topbar{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,4vw,48px)}
.topbar a{pointer-events:auto;font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center;opacity:.85;transition:opacity .3s}
.topbar a:hover{opacity:1}
.topbar .title{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:.04em}
.counter{position:absolute;left:clamp(20px,4vw,48px);bottom:34px;display:flex;align-items:baseline;gap:10px}
.counter .now{font-family:'Anton',sans-serif;font-size:56px;line-height:.8;color:var(--bone)}
.counter .tot{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.pline{position:absolute;left:clamp(20px,4vw,48px);right:clamp(20px,4vw,48px);bottom:24px;height:2px;background:rgba(241,232,216,.14);overflow:hidden}
.pline i{position:absolute;left:0;top:0;height:100%;width:0;background:var(--sienna)}
.hint{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);animation:pulse 2s ease-in-out infinite;transition:opacity .6s}
.hint.gone{opacity:0}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.9}}
.caption{position:absolute;right:clamp(20px,4vw,48px);bottom:44px;text-align:right;max-width:40vw}
.caption .t{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(18px,2.4vw,30px);opacity:.9}

/* loader */
#loader{position:fixed;inset:0;z-index:50;background:#0d0908;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s}
#loader.hide{opacity:0;pointer-events:none}
#loader .lw{font-family:'Anton',sans-serif;font-size:clamp(40px,9vw,120px);text-transform:uppercase;line-height:.85;letter-spacing:-.01em}
#loader .lw span{color:transparent;-webkit-text-stroke:1.5px var(--bone)}
#loader .lbar{width:min(320px,70vw);height:2px;background:rgba(241,232,216,.16);overflow:hidden}
#loader .lbar i{display:block;height:100%;width:0;background:var(--sienna);transition:width .3s}
#loader .lp{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.enter-btn{margin-top:6px;pointer-events:auto;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--bone);border-radius:100px;padding:14px 26px;cursor:none;background:none;color:var(--bone);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s,background .3s,color .3s}
.enter-btn.show{opacity:1;transform:translateY(0)}
.enter-btn:hover{background:var(--bone);color:var(--ink)}

/* click-to-enlarge tip */
.gtip{position:absolute;left:clamp(20px,4vw,48px);bottom:92px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);opacity:.6}
/* lightbox */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(13,9,8,.95);display:none;align-items:center;justify-content:center;padding:6vh 6vw;pointer-events:auto}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:84vh;object-fit:contain;border-radius:4px;box-shadow:0 40px 90px rgba(0,0,0,.6);animation:lbin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes lbin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.lb-close{position:absolute;top:22px;right:26px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);background:none;border:1px solid rgba(241,232,216,.4);border-radius:100px;padding:10px 16px;cursor:none}
.lb-close:hover{background:var(--bone);color:var(--ink)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-family:'Fraunces',serif;font-size:44px;color:var(--bone);opacity:.55;padding:10px 20px;cursor:none;user-select:none;transition:opacity .3s}
.lb-nav:hover{opacity:1}
.lb-prev{left:1vw}.lb-next{right:1vw}
.lb-count{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--muted)}
/* instagram end CTA */
.end-cta{position:absolute;left:50%;bottom:92px;transform:translate(-50%,12px);text-align:center;opacity:0;pointer-events:none;transition:opacity .6s,transform .6s}
.end-cta.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.end-cta .et{font-family:'Fraunces',serif;font-style:italic;font-size:16px;color:var(--muted);margin-bottom:12px}
.end-cta a{display:inline-flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--bone);border-radius:100px;padding:14px 24px;color:var(--bone);transition:background .3s,color .3s}
.end-cta a:hover{background:var(--bone);color:var(--ink)}
@media(max-width:600px){
  .topbar{padding:16px 18px}
  .topbar .title{font-size:14px;letter-spacing:.06em}
  .topbar span:last-child{display:none}
  .counter .now{font-size:38px}
  .caption{max-width:70vw;bottom:52px;right:18px}
  .caption .t{font-size:14px}
  .gtip{display:none}
  .hint{font-size:10px;letter-spacing:.16em;bottom:56px}
  .end-cta{bottom:74px}
  .end-cta a{padding:12px 20px;font-size:11px}
}
</style>
<link rel="stylesheet" href="paper.css">
</head>
<body>
<canvas id="scene"></canvas>
<div class="scroller"></div>

<div class="cursor"></div><div class="cursor-ring"></div>

<div class="ui">
  <div class="topbar">
    <a href="index.html" data-hov>← Back</a>
    <span class="title">THE GALLERY</span>
    <span id="spaceCount" style="font-size:11px;letter-spacing:.14em;color:var(--muted)">SPACE · 21</span>
  </div>
  <div class="counter"><span class="now" id="now">01</span><span class="tot" id="tot">/ 21</span></div>
  <div class="hint" id="hint">Scroll to cruise</div>
  <div class="gtip">◆ Click a photo to enlarge</div>
  <div class="end-cta" id="endCta">
    <div class="et">Liked the view? There's more.</div>
    <a href="https://instagram.com/jxjha" target="_blank" data-hov>Instagram · @jxjha ↗</a>
  </div>
  <div class="pline"><i id="pfill"></i></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" data-hov>Close ✕</button>
  <div class="lb-nav lb-prev" id="lbPrev" data-hov>‹</div>
  <img id="lbImg" src="" alt="photograph">
  <div class="lb-nav lb-next" id="lbNext" data-hov>›</div>
  <div class="lb-count" id="lbCount"></div>
</div>

<div id="loader">
  <div class="lw">THE&nbsp;<span>GALLERY</span></div>
  <div class="lbar"><i id="lfill"></i></div>
  <div class="lp" id="lp">Warming up the projector… 0%</div>
  <button class="enter-btn" id="enter" data-hov>Enter ↗</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
<script src="gallery-images.js"></script>
<script>
const TOTAL=(window.GALLERY_IMAGES&&window.GALLERY_IMAGES.length)||21;
/* keep the on-screen counts in sync with however many photos are in the set */
(function(){const sc=document.getElementById('spaceCount');if(sc)sc.textContent='SPACE · '+TOTAL;const t=document.getElementById('tot');if(t)t.textContent='/ '+TOTAL;})();
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d0908);
scene.fog=new THREE.FogExp2(0x0d0908,0.013);

/* narrower viewports = wider FOV so the images and the path both fit at once */
function fovFor(){const a=innerWidth/innerHeight;return a<0.75?92:a<1?82:68;}
const camera=new THREE.PerspectiveCamera(fovFor(),innerWidth/innerHeight,0.1,600);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('scene'),antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;

/* ---------- winding path through space ---------- */
const pts=[];
const SEG=14, STEP=27;
// lead-in runway — start farther back so the path & first photo are seen from a distance
pts.push(new THREE.Vector3(0,0.5,STEP*1.9));
pts.push(new THREE.Vector3(2,0,STEP*0.9));
for(let i=0;i<SEG;i++){
  pts.push(new THREE.Vector3(
    Math.sin(i*0.62)*11 + Math.sin(i*0.27)*4,
    Math.cos(i*0.5)*5 + Math.sin(i*0.9)*2,
    -i*STEP
  ));
}
const curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.5);

/* ---------- the white path ---------- */
const tube=new THREE.Mesh(
  new THREE.TubeGeometry(curve,340,0.055,8,false),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.92,fog:true})
);
scene.add(tube);
// faint glow halo around the path
const glow=new THREE.Mesh(
  new THREE.TubeGeometry(curve,340,0.18,8,false),
  new THREE.MeshBasicMaterial({color:0xF1E8D8,transparent:true,opacity:0.08,fog:true})
);
scene.add(glow);

/* ---------- starfield ---------- */
(function(){
  const g=new THREE.BufferGeometry();const n=1400;const p=new Float32Array(n*3);
  for(let i=0;i<n;i++){p[i*3]=(Math.random()-0.5)*260;p[i*3+1]=(Math.random()-0.5)*180;p[i*3+2]=-Math.random()*260+20;}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const m=new THREE.PointsMaterial({color:0xC25A2E,size:0.35,transparent:true,opacity:0.55,sizeAttenuation:true});
  scene.add(new THREE.Points(g,m));
  // warm dust
  const g2=new THREE.BufferGeometry();const n2=600;const p2=new Float32Array(n2*3);
  for(let i=0;i<n2;i++){p2[i*3]=(Math.random()-0.5)*120;p2[i*3+1]=(Math.random()-0.5)*90;p2[i*3+2]=-Math.random()*260+20;}
  g2.setAttribute('position',new THREE.BufferAttribute(p2,3));
  scene.add(new THREE.Points(g2,new THREE.PointsMaterial({color:0xF1E8D8,size:0.14,transparent:true,opacity:0.4})));
})();

/* ---------- image planes along the path ---------- */
const manager=new THREE.LoadingManager();
const loader=new THREE.TextureLoader(manager);
const items=[]; // {group, img, ti}
const up=new THREE.Vector3(0,1,0);

const NARROW=innerWidth/innerHeight<0.85;
const LAT=NARROW?5.2:7.6;   // pull planes closer to the path on narrow screens so they read at phone size
for(let i=0;i<TOTAL;i++){
  const ti=0.16+(i/(TOTAL-1))*(0.93-0.16); // spread out, starting after the lead-in runway
  const base=curve.getPointAt(ti);
  const tan=curve.getTangentAt(ti).normalize();
  const side=new THREE.Vector3().crossVectors(tan,up).normalize();

  // strictly alternate on either side of the path, at a fixed distance
  const lateral=(i%2===0? 1 : -1) * LAT;
  const pos=base.clone().add(side.clone().multiplyScalar(lateral)).add(up.clone().multiplyScalar(1.4));

  const group=new THREE.Group();
  group.position.copy(pos);

  // frame (matte)
  const frameMat=new THREE.MeshBasicMaterial({color:0xF1E8D8});
  const frame=new THREE.Mesh(new THREE.PlaneGeometry(1,1),frameMat);
  frame.position.z=-0.05;
  group.add(frame);

  // image
  const mat=new THREE.MeshBasicMaterial({color:0x1a1a1a,side:THREE.DoubleSide});
  const img=new THREE.Mesh(new THREE.PlaneGeometry(1,1),mat);
  group.add(img);

  loader.load(window.GALLERY_IMAGES[i],(tex)=>{
    tex.encoding=THREE.sRGBEncoding;
    const aspect=tex.image.width/tex.image.height;
    const H=6.4, W=H*aspect;
    img.material.map=tex;img.material.color.set(0xffffff);img.material.needsUpdate=true;
    img.scale.set(W,H,1);
    frame.scale.set(W+0.5,H+0.5,1);
  });

  scene.add(group);
  items.push({group,img,frame,ti});
}

/* ---------- scroll → progress ---------- */
const lenis=new Lenis({lerp:0.08,wheelMultiplier:0.9});
function raf(t){lenis.raf(t);requestAnimationFrame(raf);}requestAnimationFrame(raf);
let targetP=0,curP=0;
function computeProgress(){
  const max=document.body.scrollHeight-innerHeight;
  targetP=max>0?Math.min(Math.max(window.scrollY/max,0),1):0;
}
lenis.on('scroll',computeProgress);window.addEventListener('scroll',computeProgress);

const hint=document.getElementById('hint');
let hinted=false;
function dismissHint(){if(!hinted){hinted=true;hint.classList.add('gone');}}

/* ---------- eased rewind to start when scrolling past the end ---------- */
let reversing=false, revT0=0; const REV_DUR=2600;
function easeInOut(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function startReverse(){
  if(reversing) return;
  reversing=true; revT0=performance.now(); lenis.stop();
  hint.textContent='Returning to start ↺'; hint.classList.remove('gone');
}
window.addEventListener('wheel',(e)=>{
  dismissHint();
  if(!reversing && targetP>0.985 && e.deltaY>0) startReverse();
},{passive:true});
let _ty=0;
window.addEventListener('touchstart',e=>{_ty=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchmove',(e)=>{
  dismissHint();
  const dy=_ty-e.touches[0].clientY;
  if(!reversing && targetP>0.985 && dy>4) startReverse();
},{passive:true});

/* ---------- click a photo to enlarge (raycast) ---------- */
const raycaster=new THREE.Raycaster();
const ndc=new THREE.Vector2();
const imgMeshes=items.map(it=>it.img);
items.forEach((it,idx)=>{it.img.userData.idx=idx;});
function pick(x,y){ndc.x=(x/innerWidth)*2-1;ndc.y=-(y/innerHeight)*2+1;raycaster.setFromCamera(ndc,camera);const hits=raycaster.intersectObjects(imgMeshes,false);return hits.length?hits[0].object.userData.idx:-1;}
const canvasEl=renderer.domElement;
canvasEl.addEventListener('mousemove',e=>{const idx=pick(e.clientX,e.clientY);document.body.classList.toggle('hovering',idx>=0);});
canvasEl.addEventListener('click',e=>{const idx=pick(e.clientX,e.clientY);if(idx>=0)openLB(idx);});

/* ---------- lightbox ---------- */
const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg'),lbCount=document.getElementById('lbCount');
let lbIdx=-1;
function openLB(i){lbIdx=(i+TOTAL)%TOTAL;lbImg.src=window.GALLERY_IMAGES[lbIdx];lbCount.textContent=String(lbIdx+1).padStart(2,'0')+' / '+TOTAL;lb.classList.add('open');lenis.stop();}
function closeLB(){lb.classList.remove('open');lenis.start();}
document.getElementById('lbClose').addEventListener('click',closeLB);
document.getElementById('lbPrev').addEventListener('click',()=>openLB(lbIdx-1));
document.getElementById('lbNext').addEventListener('click',()=>openLB(lbIdx+1));
lb.addEventListener('click',e=>{if(e.target===lb)closeLB();});
window.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLB();else if(e.key==='ArrowRight')openLB(lbIdx+1);else if(e.key==='ArrowLeft')openLB(lbIdx-1);});
const endCta=document.getElementById('endCta');

/* ---------- render loop ---------- */
const now=document.getElementById('now');
const pfill=document.getElementById('pfill');
const tmpLook=new THREE.Vector3();
let started=false;

function animate(){
  requestAnimationFrame(animate);

  if(reversing){
    const t=Math.min((performance.now()-revT0)/REV_DUR,1);
    curP=1-easeInOut(t);            // ease from end (1) back to start (0)
    if(t>=1){
      reversing=false;
      window.scrollTo(0,0);
      lenis.scrollTo(0,{immediate:true});
      lenis.start();
      targetP=0; curP=0;
      hint.textContent='Scroll to cruise'; hinted=false; hint.classList.remove('gone');
    }
  } else {
    curP+=(targetP-curP)*0.06;
  }

  const camPar=Math.min(0.002+curP*0.958,0.999);
  const camPos=curve.getPointAt(camPar).add(new THREE.Vector3(0,2.3,0));
  camera.position.lerp(camPos,0.25);

  const ahead=curve.getPointAt(Math.min(camPar+0.02,0.999)).add(new THREE.Vector3(0,1.3,0));
  tmpLook.copy(ahead);
  camera.lookAt(tmpLook);

  // billboard each image to camera + subtle scale emphasis when near
  let nearest=0,nd=1e9;
  items.forEach((it,idx)=>{
    it.group.lookAt(camera.position);
    const d=it.group.position.distanceTo(camera.position);
    if(d<nd){nd=d;nearest=idx;}
    const emph=THREE.MathUtils.clamp(1-(d-6)/26,0,1);
    const s=1+emph*0.12;
    it.group.scale.setScalar(s);
  });

  now.textContent=String(Math.min(nearest+1,TOTAL)).padStart(2,'0');
  pfill.style.width=(curP*100)+'%';
  endCta.classList.toggle('show', curP>0.9 && !reversing && !lb.classList.contains('open'));

  renderer.render(scene,camera);
}
animate();

/* ---------- resize ---------- */
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=fovFor();camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ---------- loader ---------- */
const lfill=document.getElementById('lfill'),lp=document.getElementById('lp'),enterBtn=document.getElementById('enter'),loaderEl=document.getElementById('loader');
manager.onProgress=(url,loaded,total)=>{const pct=Math.round(loaded/total*100);lfill.style.width=pct+'%';lp.textContent=`Warming up the projector… ${pct}%`;};
manager.onLoad=()=>{lp.textContent='Ready.';enterBtn.classList.add('show');};
enterBtn.addEventListener('click',()=>{loaderEl.classList.add('hide');});
// safety: reveal enter after 6s even if some textures stall
setTimeout(()=>enterBtn.classList.add('show'),6000);

/* ---------- cursor ---------- */
const cur=document.querySelector('.cursor'),ring=document.querySelector('.cursor-ring');let mx=0,my=0,rx=0,ry=0;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
(function r(){rx+=(mx-rx)*0.2;ry+=(my-ry)*0.2;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(r);})();
document.addEventListener('mouseover',e=>{if(e.target.closest('[data-hov]'))document.body.classList.add('hovering');});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-hov]'))document.body.classList.remove('hovering');});
</script>
</body>
</html>
